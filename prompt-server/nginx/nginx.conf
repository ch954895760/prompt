# Nginx 配置文件 - 用于生产环境部署
# 将此文件复制到服务器的 /etc/nginx/sites-available/ 目录，然后创建软链接到 sites-enabled

server {
    listen 80;
    server_name your-domain.com;  # 修改为你的域名

    # 前端静态文件
    location / {
        root /opt/prompt-ui/dist;  # 前端构建后的dist目录
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 头像文件访问 - 直接由Nginx提供静态文件服务
    # 注意：路径必须与 application-prod.yml 中的 file.upload.path 一致
    location /uploads {
        alias /opt/prompt-server/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # 允许跨域访问（如果需要）
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # API请求转发到Spring Boot
    location /api {
        proxy_pass http://localhost:8060/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 文件上传相关配置
        client_max_body_size 10M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

